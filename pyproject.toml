[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl"
version = "0.1.0"
description = "Anukriti Oncology Safety Ledger — evidence-attributed PGx interpretation and outcome capture"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly per AGENTS.md: a new engine version carries CPIC table
    # updates that need clinical regression review first. 0.9.0 reviewed and
    # approved 2026-08-17 — see anukriti-pgx-core
    # docs/REGRESSION_REVIEW_0.8.2_to_0.9.0.md. 1,991 genotype cases:
    # SAFETY_FIX 64, NOMENCLATURE 18, SAME 1909; zero NEWLY_INDETERMINATE,
    # zero OVER_RESTRICTION_FIX, zero PHENOTYPE_CHANGE, zero ACTION_LOST.
    #
    # This is a FLOOR, not a preference. 0.9.0 introduced
    # Diplotype.hapb3_basis, and without it asl cannot tell a HapB3 call
    # inferred from the benign tag SNP from one observed at the causal variant
    # — a distinction CPIC's guideline requires to be stated in the test
    # report. interpret.require_hapb3_capable_engine() refuses to interpret on
    # an older engine rather than emitting a report with the disclosure
    # silently absent.
    "anukriti-pgx-core==0.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
asl = "asl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pinned CPIC tables are part of the package, not adjacent to it. Without
# this the wheel shipped no data and a pip-installed asl raised EvidenceError on
# every call, telling the user to regenerate tables that were never included.
[tool.setuptools.package-data]
asl = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ``TestStatus`` is a domain enum, not a test class, and pytest's default
# ``Test*`` prefix would try to collect it. Narrowing the pattern is what stops
# that; there are no class-based tests in this suite.
python_classes = ["Test*Case"]
