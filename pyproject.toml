[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl"
version = "0.1.0"
description = "Anukriti Oncology Safety Ledger — evidence-attributed PGx interpretation and outcome capture"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly per AGENTS.md. 0.8.1 is REVIEWED AND APPROVED for adoption
    # (anukriti-pgx-core docs/REGRESSION_REVIEW_0.7.3_to_0.8.1.md) and tagged,
    # but is not yet on PyPI — its publish job awaits an admin approval on a
    # protected environment. Held at 0.7.3 because an unresolvable pin breaks
    # every fresh install, not just CI. Bump to 0.8.1 the moment it publishes;
    # no code change is needed, the suite already passes against it.
    "anukriti-pgx-core==0.7.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
asl = "asl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ``TestStatus`` is a domain enum, not a test class, and pytest's default
# ``Test*`` prefix would try to collect it. Narrowing the pattern is what stops
# that; there are no class-based tests in this suite.
python_classes = ["Test*Case"]
