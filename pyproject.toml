[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl"
version = "0.1.0"
description = "Anukriti Oncology Safety Ledger — evidence-attributed PGx interpretation and outcome capture"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly per AGENTS.md: a new engine version carries CPIC table
    # updates that need clinical regression review first. 0.8.1 reviewed and
    # approved 2026-08-17 — see anukriti-pgx-core
    # docs/REGRESSION_REVIEW_0.7.3_to_0.8.1.md. 1901 genotype cases across 12
    # genes: every behavioural difference is in TPMT, the other eleven genes are
    # bit-identical, so DPYD is untouched. Includes the TPMT genotype-inversion
    # safety fix (a homozygous-reference patient was called Poor Metabolizer).
    "anukriti-pgx-core==0.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
asl = "asl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pinned CPIC tables are part of the package, not adjacent to it. Without
# this the wheel shipped no data and a pip-installed asl raised EvidenceError on
# every call, telling the user to regenerate tables that were never included.
[tool.setuptools.package-data]
asl = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ``TestStatus`` is a domain enum, not a test class, and pytest's default
# ``Test*`` prefix would try to collect it. Narrowing the pattern is what stops
# that; there are no class-based tests in this suite.
python_classes = ["Test*Case"]
