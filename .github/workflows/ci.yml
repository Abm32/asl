name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Lint
        run: ruff check src tests

      - name: Run the worked patient case end to end
        # The demo is documentation. If it stops producing a report, the README
        # is wrong, and that has to fail a build rather than be noticed later.
        run: |
          asl demo
          asl demo --panel cpic4_plus_sas
          asl interpret --csv fixtures/cohort_template.csv --panel cpic4
          asl quadrant --csv fixtures/cohort_template.csv

  cpic-drift:
    name: CPIC drift check
    runs-on: ubuntu-latest
    # Hits CPIC's live API. Allowed to fail the build on drift — that is the
    # point — but it is a separate job so a CPIC outage does not mask a real
    # test failure, and it does not run on forks without network egress.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Diff pinned evidence tables against live CPIC
        # Detects the case where CPIC changes a published value and our pinned
        # table silently disagrees. It CANNOT detect a change CPIC has announced
        # but not yet published — see P4_DPYD_HAPB3_CPIC_UPDATE_PENDING in
        # src/asl/data/DPYD_conflicts.json, which exists for exactly that gap.
        run: python scripts/regen_evidence_tables.py --check
